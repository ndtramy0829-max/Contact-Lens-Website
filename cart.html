<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — MY Eyes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="water-bg" aria-hidden="true">
    <div class="ripple ripple-1"></div>
    <div class="ripple ripple-2"></div>
    <div class="ripple ripple-3"></div>
    <div class="caustics"></div>
  </div>

  <header class="header">
    <nav class="nav">
      <a href="index.html" class="logo">MY Eyes</a>
      <a href="cart.html" class="cart-btn active" aria-label="View cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M6 6h15l-1.5 9h-12z"/>
          <path d="M6 6L5 3H2"/>
          <circle cx="9" cy="20" r="1"/>
          <circle cx="18" cy="20" r="1"/>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </nav>
  </header>

  <main class="cart-page">
    <div class="container">
      <a href="index.html" class="back-link">&larr; Continue Shopping</a>
      <h1>Your Cart</h1>

      <div class="cart-empty hidden" id="cartEmpty">
        <p>Your cart is empty.</p>
        <a href="index.html" class="btn btn-primary">Browse Products</a>
      </div>

      <div class="cart-content hidden" id="cartContent">
        <ul class="cart-items" id="cartItems"></ul>
        <div class="cart-summary">
          <div class="cart-total">
            <span>Total</span>
            <span id="cartTotal">$0.00</span>
          </div>
          <button class="btn btn-primary btn-full" id="checkoutBtn">Checkout</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="logo">MY Eyes</span>
      <p>&copy; 2026 MY Eyes. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    initCartPage();
  </script>
</body>
</html>
