<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — MYE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="nav-left">
        <a href="index.html" class="nav-link">Shop</a>
      </div>
      <a href="index.html" class="logo">mye</a>
      <span class="nav-admin-label">Admin</span>
    </nav>
  </header>

  <main class="admin-page">
    <div class="container">
      <div id="adminLogin" class="admin-login">
        <h1 class="checkout-section-title">Admin login</h1>
        <label class="form-label" for="adminPassword">Password</label>
        <input class="form-input" type="password" id="adminPassword">
        <p class="form-error hidden" id="adminLoginError"></p>
        <button class="btn btn-primary btn-full" id="adminLoginBtn" style="margin-top:14px;">Log in</button>
      </div>

      <div id="adminApp" class="hidden">
        <h1 class="checkout-section-title">Shop control</h1>
        <p class="welcome-desc" style="margin:0 0 8px;max-width:none;text-align:left;">
          Waiting orders auto-cancel after 24 hours and return stock. Completing payment increases sold count.
        </p>
        <div class="admin-toolbar">
          <div class="admin-tabs">
            <button class="admin-tab is-active" data-tab="inventory">Inventory</button>
            <button class="admin-tab" data-tab="orders">Orders</button>
            <button class="admin-tab" data-tab="waitlist">Waitlist</button>
          </div>
          <input class="form-input admin-search" id="adminSearch" type="search" placeholder="Search products..." autocomplete="off">
        </div>
        <p class="form-error hidden" id="adminError"></p>
        <div id="adminPanel"></div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
