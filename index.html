<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="nav-left">
        <a href="index.html" class="nav-link is-active">Shop</a>
      </div>
      <a href="index.html" class="logo">mye</a>
      <a href="cart.html" class="cart-btn" aria-label="View cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5.25" y="9" width="13.5" height="11.5" rx="2"/>
          <path d="M9 9V7.5a3 3 0 1 1 6 0V9"/>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </nav>
  </header>

  <main>
    <section class="shop">
      <div class="filters-backdrop hidden" id="filtersBackdrop"></div>
      <aside class="filters" id="filtersPanel">
        <div class="filters-mobile-header">
          <h2 class="filters-mobile-title">Filters</h2>
          <button type="button" class="filters-hide-btn" id="filtersClose" aria-label="Hide filters">&times;</button>
        </div>
        <button type="button" class="filter-reset-btn" id="resetFilters">Reset filters</button>
        <div id="filterGroups"></div>
      </aside>

      <div class="products-area">
        <div class="products-toolbar">
          <button type="button" class="filters-open-btn" id="filtersOpen">Filters</button>
        </div>

        <div class="showcase-header">
          <h2 class="showcase-title" id="showcaseTitle">All Lenses</h2>
          <div class="showcase-chips" id="showcaseChips"></div>
        </div>

        <div class="product-grid" id="productGrid"></div>
        <p class="no-results hidden" id="noResults">No products match your filters.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="logo">mye</span>
      <p>&copy; 2026 MYE. All rights reserved.</p>
    </div>
  </footer>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div class="modal-lens" id="modalLens"></div>
      <div class="modal-content">
        <p class="modal-brand" id="modalBrand"></p>
        <h2 id="modalTitle"></h2>
        <ul class="modal-specs" id="modalSpecs"></ul>
        <p class="modal-desc" id="modalDesc"></p>
        <p class="modal-price" id="modalPrice"></p>
        <span class="modal-sold-out-badge hidden" id="modalSoldOutBadge">sold out</span>
        <div class="modal-actions" id="modalActions">
          <button class="btn btn-primary" id="modalAddToCart">Add to Cart</button>
          <button class="btn btn-primary hidden" id="modalJoinWaitlist" type="button">Join the waitlist</button>
        </div>
      </div>
    </div>
  </div>

  <div class="waitlist-overlay hidden" id="waitlistOverlay">
    <div class="waitlist-modal" role="dialog" aria-modal="true" aria-labelledby="waitlistModalTitle">
      <button class="waitlist-modal-close" id="waitlistClose" type="button" aria-label="Close">&times;</button>
      <h3 class="waitlist-modal-title" id="waitlistModalTitle">Join the waitlist</h3>
      <p class="waitlist-copy">We'll contact you when this product is back in stock.</p>
      <input class="form-input" type="text" id="waitlistInstagram" placeholder="@your instagram username" autocomplete="off" autocapitalize="none">
      <input class="form-input hidden" type="tel" id="waitlistPhone" placeholder="Phone number" autocomplete="tel">
      <button class="waitlist-no-ig" type="button" id="waitlistNoInstagram">I don't have instagram</button>
      <p class="form-error hidden" id="waitlistError"></p>
      <p class="waitlist-success hidden" id="waitlistSuccess">You're on the waitlist.</p>
      <button class="btn btn-primary btn-full" type="button" id="waitlistSubmit">Join waitlist</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script src="products-data.js"></script>
  <script src="script.js"></script>
  <script>
    initShopPage();
  </script>
</body>
</html>
